<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cámara iPhone · Aleta</title><style>body{font:16px system-ui;background:#0d2530;color:#eef9f5;margin:1.2em;max-width:700px}textarea{box-sizing:border-box;width:100%;height:8em}button{font:inherit;padding:.8em;margin:.4em 0}video{width:100%;max-height:40vh;background:#172d35}p{line-height:1.5}</style></head><body><h1>Cámara del iPhone</h1><p>Este teléfono usa su cámara trasera y envía el video directamente al navegador del Mac. Mantén esta página abierta.</p><label for="offer">1. Pega el código del Mac</label><textarea id="offer"></textarea><button id="start">2. Activar cámara y generar respuesta</button><p id="status">Esperando el código del Mac.</p><video id="preview" autoplay playsinline muted></video><label for="answer">3. Copia esta respuesta al Mac</label><textarea id="answer" readonly></textarea><button id="copy">Copiar respuesta</button><script>
let pc,stream;const $=id=>document.getElementById(id);function iceReady(p){return new Promise(resolve=>{if(p.iceGatheringState==='complete')return resolve();const done=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',done);resolve()}};p.addEventListener('icegatheringstatechange',done);setTimeout(resolve,10000)})}
$('start').onclick=async()=>{try{pc?.close();stream?.getTracks().forEach(t=>t.stop());pc=new RTCPeerConnection();await pc.setRemoteDescription(JSON.parse($('offer').value));stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});$('preview').srcObject=stream;for(const track of stream.getTracks())pc.addTrack(track,stream);await pc.setLocalDescription(await pc.createAnswer());$('status').textContent='Preparando conexión…';await iceReady(pc);$('answer').value=JSON.stringify(pc.localDescription);$('status').textContent='Copia la respuesta al Mac y manten esta página abierta.';pc.onconnectionstatechange=()=>{$('status').textContent='Conexión: '+pc.connectionState}}catch(e){$('status').textContent='Error: '+e.message}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('answer').value);$('status').textContent='Respuesta copiada.'}catch{$('answer').select();$('status').textContent='Selecciona y copia la respuesta manualmente.'}};
</script></body></html>
