<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cámara iPhone · Aleta</title><style>body{font:16px system-ui;background:#0d2530;color:#eef9f5;margin:1.2em;max-width:700px}textarea{box-sizing:border-box;width:100%;height:8em}button{font:inherit;padding:.8em;margin:.4em 0}video{width:100%;max-height:40vh;background:#172d35}p{line-height:1.5}</style></head><body><h1>Cámara del iPhone</h1><p>Este teléfono usa su cámara trasera y envía el video al Mac. Mantén esta página abierta.</p><section id="automatic" hidden><button id="auto-start">Activar cámara y conectar</button><button id="auto-stop">Detener</button><p id="auto-status">Listo para conectar.</p></section><details id="manual"><summary>Conexión manual alternativa</summary><label for="offer">1. Pega el código del Mac</label><textarea id="offer"></textarea><button id="start">2. Activar cámara y generar respuesta</button><p id="status">Esperando el código del Mac.</p><label for="answer">3. Copia esta respuesta al Mac</label><textarea id="answer" readonly></textarea><button id="copy">Copiar respuesta</button></details><video id="preview" autoplay playsinline muted></video><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
let pc,stream;const $=id=>document.getElementById(id);function iceReady(p){return new Promise(resolve=>{if(p.iceGatheringState==='complete')return resolve();const done=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',done);resolve()}};p.addEventListener('icegatheringstatechange',done);setTimeout(resolve,10000)})}
const target=location.hash.slice(1);let autoPeer,autoCall;if(/^aleta-[0-9a-f]{32}$/.test(target)){$('automatic').hidden=false;$('manual').open=false}else $('manual').open=true;
function autoStop(){autoCall?.close();autoCall=null;autoPeer?.destroy();autoPeer=null;stream?.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;$('auto-status').textContent='Cámara detenida.'}
$('auto-stop').onclick=autoStop;$('auto-start').onclick=async()=>{autoStop();if(typeof Peer==='undefined'){$('auto-status').textContent='No cargó PeerJS; comprueba Internet.';return}try{$('auto-status').textContent='Solicitando cámara…';stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});$('preview').srcObject=stream;const p=autoPeer=new Peer();$('auto-status').textContent='Conectando con el Mac…';p.on('open',()=>{if(autoPeer!==p)return;const call=autoCall=p.call(target,stream);call.on('error',e=>{$('auto-status').textContent='Error de video: '+e.message});call.on('close',()=>{$('auto-status').textContent='La conexión terminó.'});$('auto-status').textContent='Cámara activa. Comprueba el video en el Mac.'});p.on('error',e=>{if(autoPeer!==p)return;$('auto-status').textContent='No se pudo conectar: '+e.type+'. Vuelve a escanear el QR.'})}catch(e){$('auto-status').textContent='No se pudo activar la cámara: '+e.message}};
$('start').onclick=async()=>{try{pc?.close();stream?.getTracks().forEach(t=>t.stop());pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});await pc.setRemoteDescription(JSON.parse($('offer').value));stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});$('preview').srcObject=stream;for(const track of stream.getTracks())pc.addTrack(track,stream);await pc.setLocalDescription(await pc.createAnswer());$('status').textContent='Preparando conexión…';await iceReady(pc);$('answer').value=JSON.stringify(pc.localDescription);$('status').textContent='Copia la respuesta al Mac y manten esta página abierta.';pc.onconnectionstatechange=()=>{$('status').textContent='Conexión: '+pc.connectionState}}catch(e){$('status').textContent='Error: '+e.message}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('answer').value);$('status').textContent='Respuesta copiada.'}catch{$('answer').select();$('status').textContent='Selecciona y copia la respuesta manualmente.'}};
</script></body></html>
